<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Chat 💚</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">

  <!-- Header (YOUR NAME because it's her POV) -->
  <div class="header">
    <div class="profile">
      <div class="avatar"></div>
      <div class="name" id="yourName">Rudra 💚</div>
    </div>
    <div class="status" id="status">online</div>
  </div>

  <!-- Chat -->
  <div class="chat" id="chat">
    <div class="bubble left typing" id="typingBubble">typing...</div>
  </div>

  <!-- Her reply buttons -->
  <div class="options">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 💔</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
